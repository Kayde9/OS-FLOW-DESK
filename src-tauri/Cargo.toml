[package]
name = "flowdesk"
version = "0.1.0"
description = "FlowDesk — Operating Systems Observatory, Algorithm Lab and Desktop Performance Manager"
edition = "2021"

[lib]
name = "flowdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
nvml-wrapper = "0.13.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.39.6"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
walkdir = "2.5.0"
windows = { version = "0.62.2", features = [
    "Win32_System_Performance",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
